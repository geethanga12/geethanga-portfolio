<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          var dark = savedTheme ? savedTheme === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/letter-g.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload LCP hero image — browser starts fetch before JS executes -->
    <link rel="preload" as="image" href="/assets/Geeth_img.JPG" fetchpriority="high" />
    <!-- Font connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Title and meta managed per-page by react-helmet-async -->
    <title>Geethanga Dissanayake - Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
